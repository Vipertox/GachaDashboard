name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Bitte keine Cookies, Tokens oder andere Zugangsdaten in das Issue kopieren.
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
      description: Was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: plattform
    attributes:
      label: Plattform
      options: [Windows, Android, Browser]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: z. B. 0.1.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs oder Screenshots
      description: Vorher auf Zugangsdaten prüfen und diese entfernen.
