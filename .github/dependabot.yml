# Nur Sicherheitsupdates für npm, Cargo und Gradle (limit 0 schaltet reine Versionsupdates ab).
# Actions laufen weiter monatlich, damit die gepinnten SHAs aktuell bleiben.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: gradle
    directory: /src-tauri/gen/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
