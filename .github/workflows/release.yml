name: Release

# Neue Version veröffentlichen (Git Flow): auf release/X.Y.Z bzw. hotfix/X.Y.Z die Version
# erhöhen, per PR nach main mergen, dann auf main `git tag -s vX.Y.Z && git push origin vX.Y.Z`.
# Der Job wartet anschließend auf die Freigabe im Environment "release".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # Signierschlüssel liegen nur als Environment-Secrets vor und erfordern eine manuelle Freigabe
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Nur Stände, die über einen PR in main gelandet sind, dürfen ausgeliefert werden
      - name: Tag liegt auf main prüfen
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME zeigt auf keinen Commit in main"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Tag und App-Version müssen übereinstimmen, sonst erkennt der Updater kein Update
      - name: Version prüfen
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $version in tauri.conf.json"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gacha Dashboard ${{ github.ref_name }}
          releaseDraft: false
          # erzeugt latest.json, die der Updater in der App abfragt
          includeUpdaterJson: true
